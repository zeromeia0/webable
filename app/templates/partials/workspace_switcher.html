{# Expects: instances (list), active_workspace or workspace_for_nav #}
{% if instances and instances|length > 0 %}
<div class="flex items-center gap-2">
  <label class="text-[11px] text-slate-400 hidden sm:inline">Workspace</label>
  <select id="wbWorkspaceSelect" class="text-sm rounded-lg bg-slate-800 border border-slate-600 px-2 py-1.5 text-slate-100 max-w-[180px]">
    {% for ws in instances %}
    <option value="{{ ws.id }}" {% if (active_workspace or workspace_for_nav) and ws.id == (active_workspace or workspace_for_nav).id %}selected{% endif %}>{{ ws.name }}</option>
    {% endfor %}
  </select>
  <form id="wbWorkspaceSwitchForm" method="post" action="/workspaces/{{ (active_workspace or workspace_for_nav).id }}/switch" class="hidden">
    <input type="hidden" name="next_url" value="{{ request.url.path }}" />
  </form>
  <script>
    (function () {
      var sel = document.getElementById('wbWorkspaceSelect');
      var form = document.getElementById('wbWorkspaceSwitchForm');
      if (!sel || !form) return;
      sel.addEventListener('change', function () {
        form.action = '/workspaces/' + sel.value + '/switch';
        form.submit();
      });
    })();
  </script>
</div>
{% endif %}
