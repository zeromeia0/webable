<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Accept invite</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full rounded-2xl border border-slate-800 bg-slate-900 p-8 space-y-4">
    <h1 class="text-2xl font-bold">Workspace invitation</h1>
    {% if instance %}
    <p class="text-slate-300">You have been invited to join <strong>{{ instance.name }}</strong> as <strong>{{ invite.role }}</strong>.</p>
    {% else %}
    <p class="text-rose-300">This workspace no longer exists.</p>
    {% endif %}
    {% if user and instance %}
    <form method="post" action="/invite/{{ invite.token }}/accept">
      <button type="submit" class="w-full px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 font-medium">Accept invite</button>
    </form>
    {% elif not user %}
    <p class="text-sm text-slate-400">Log in as <strong>{{ invite.email }}</strong> to accept this invite.</p>
    <a href="/?next=/invite/{{ invite.token }}" class="block text-center px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600">Go to login</a>
    {% endif %}
  </div>
</body>
</html>
